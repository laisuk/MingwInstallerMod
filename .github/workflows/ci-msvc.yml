name: CI (MSVC, windows-latest)

on:
  workflow_dispatch:

jobs:
  build-msvc:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Configure (CMake)
        shell: pwsh
        run: cmake --preset release-msvc

      - name: Build
        shell: pwsh
        run: |
          cmake --build --preset release-msvc -v

      - name: Upload artifact (exe)
        uses: actions/upload-artifact@v7
        with:
          name: MingwInstallerMod-${{ runner.os }}-x64-windows-static
          path: |
            build/release-msvc/MingwInstallerMod.exe
          if-no-files-found: error
